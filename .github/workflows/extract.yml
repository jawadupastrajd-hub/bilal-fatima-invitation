name: Extract invitation site to repo root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip flat to repo root
        run: |
          unzip -o bilal-fatima-invitation.zip
          rm bilal-fatima-invitation.zip
          rm -rf .github
          ls -la
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Extract updated invitation site to repo root" || echo "Nothing to commit"
          git push
