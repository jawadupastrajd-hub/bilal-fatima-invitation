name: Extract invitation site

on:
  workflow_dispatch:
  push:
    paths:
      - 'bilal-fatima-invitation.zip'
      - '.github/workflows/extract.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip flat to repo root
        run: unzip -o bilal-fatima-invitation.zip
      - name: Remove zip and workflow, commit extracted files
        run: |
          rm -f bilal-fatima-invitation.zip
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract updated invitation site to repo root"
          git push
