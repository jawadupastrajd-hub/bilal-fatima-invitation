name: Extract invitation site

on:
  push:
    paths:
      - 'bilal-fatima-invitation.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip flat to repo root
        run: |
          ls -la
          test -f bilal-fatima-invitation.zip
          unzip -o bilal-fatima-invitation.zip -d .
          rm -f bilal-fatima-invitation.zip
          rm -rf .github
          ls -la
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --quiet || git commit -m "Extract updated invitation site to repo root"
          git push
