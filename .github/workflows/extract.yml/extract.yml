name: Extract zip

on:
  push:
    paths:
      - 'bilal-fatima-invitation.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip flat to repo root
        run: |
          set -e
          mkdir -p /tmp/extracted
          unzip -o bilal-fatima-invitation.zip -d /tmp/extracted
          if [ -d /tmp/extracted/bilal-fatima-invitation ]; then
            cp -a /tmp/extracted/bilal-fatima-invitation/. .
          else
            cp -a /tmp/extracted/. .
          fi
          rm -f bilal-fatima-invitation.zip
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract bilal-fatima-invitation.zip to repo root" || echo "Nothing to commit"
          git push
