name: Extract invitation zip
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip flat to repo root
        run: |
          if [ ! -f bilal-fatima-invitation.zip ]; then
            echo "No zip to extract."
            exit 0
          fi
          unzip -o bilal-fatima-invitation.zip
          cp -a bilal-fatima-invitation/. .
          rm -rf bilal-fatima-invitation bilal-fatima-invitation.zip .github
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract invitation site to repo root" || echo "Nothing to commit"
          git push
