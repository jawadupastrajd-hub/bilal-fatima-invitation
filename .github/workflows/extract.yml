name: Extract site zip

on:
  push:
    paths:
      - 'bilal-fatima-invitation.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip flat to repo root
        run: |
          unzip -o bilal-fatima-invitation.zip
          if [ -d bilal-fatima-invitation ]; then cp -a bilal-fatima-invitation/. .; rm -rf bilal-fatima-invitation; fi
          rm -f bilal-fatima-invitation.zip
          ls -la
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract updated site files" || echo "Nothing to commit"
          git push
