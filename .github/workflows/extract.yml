name: Extract invitation zip

on:
  workflow_dispatch:
  push:
    paths:
      - 'bilal-fatima-invitation.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip flat to repo root
        run: |
          unzip -o bilal-fatima-invitation.zip
          rm bilal-fatima-invitation.zip
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --quiet || git commit -m "Extract updated invitation site"
          git push
