name: Extract invitation zip

on:
  push:
    paths:
      - 'bilal-fatima-invitation.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip flat to repo root
        run: |
          set -e
          unzip -o bilal-fatima-invitation.zip -d /tmp/extracted
          if [ "$(ls -1 /tmp/extracted | wc -l)" = "1" ] && [ -d "/tmp/extracted/$(ls -1 /tmp/extracted)" ]; then
            SRC="/tmp/extracted/$(ls -1 /tmp/extracted)"
          else
            SRC="/tmp/extracted"
          fi
          echo "Extracting from $SRC"
          ls -la "$SRC"
          cp -a "$SRC"/. .
          rm -f bilal-fatima-invitation.zip
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --quiet || git commit -m "Extract updated invitation site to repo root"
          git push
