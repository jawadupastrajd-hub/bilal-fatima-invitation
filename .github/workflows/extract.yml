name: Extract invitation site

on:
  push:
    paths:
      - 'bilal-fatima-invitation.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip flat to repo root
        run: |
          set -e
          if [ ! -f bilal-fatima-invitation.zip ]; then
            echo "No zip found, skipping."
            exit 0
          fi
          rm -rf /tmp/extracted
          mkdir -p /tmp/extracted
          unzip -o bilal-fatima-invitation.zip -d /tmp/extracted
          TOP=$(find /tmp/extracted -mindepth 1 -maxdepth 1)
          COUNT=$(printf '%s\n' "$TOP" | wc -l)
          if [ "$COUNT" = "1" ] && [ -d "$TOP" ]; then
            SRC="$TOP"
          else
            SRC="/tmp/extracted"
          fi
          echo "Copying from $SRC"
          cp -a "$SRC"/. .
          rm -f bilal-fatima-invitation.zip
          rm -rf /tmp/extracted
          ls -la
          ls -la assets || true
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract invitation site to repo root"
            git push
          fi
