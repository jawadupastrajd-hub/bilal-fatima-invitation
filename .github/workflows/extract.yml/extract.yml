name: Extract invitation zip

on:
  push:
    paths:
      - 'bilal-fatima-invitation.zip'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip flat to repo root
        run: |
          set -e
          rm -rf /tmp/extract
          mkdir -p /tmp/extract
          unzip -o bilal-fatima-invitation.zip -d /tmp/extract
          if [ "$(find /tmp/extract -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ] && [ -d "$(find /tmp/extract -mindepth 1 -maxdepth 1)" ]; then
            SRC="$(find /tmp/extract -mindepth 1 -maxdepth 1)"
          else
            SRC=/tmp/extract
          fi
          cp -a "$SRC"/. .
          rm -f bilal-fatima-invitation.zip
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract updated invitation site to repo root"
          git push
