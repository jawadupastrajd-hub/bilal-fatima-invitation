name: Extract site zip

on:
  workflow_dispatch:
  push:
    paths:
      - 'bilal-fatima-invitation.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip flat to repo root and clean up
        run: |
          unzip -o bilal-fatima-invitation.zip
          rm -f bilal-fatima-invitation.zip
          rm -rf .github
          ls -la
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Update site: stronger marquee edge fade" || echo "Nothing to commit"
          git push
