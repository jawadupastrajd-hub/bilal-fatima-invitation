name: Extract invitation site to repo root

on:
  push:
    paths:
      - 'bilal-fatima-invitation.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip flat to repo root
        run: |
          set -e
          rm -rf /tmp/site-extract
          mkdir -p /tmp/site-extract
          unzip -o bilal-fatima-invitation.zip -d /tmp/site-extract
          SRC="/tmp/site-extract"
          if [ "$(find "$SRC" -mindepth 1 -maxdepth 1 | wc -l)" = "1" ] && [ -d "$(find "$SRC" -mindepth 1 -maxdepth 1)" ]; then
            SRC="$(find "$SRC" -mindepth 1 -maxdepth 1)"
          fi
          cp -a "$SRC"/. .
          rm -f bilal-fatima-invitation.zip
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract updated invitation site to repo root"
            git push
          fi
